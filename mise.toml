[tasks.setup]
run = """
mise run install
mise run link
if ! grep -q "source ~/.config/zsh/init.zsh" ~/.zshrc 2>/dev/null; then
    echo "source ~/.config/zsh/init.zsh" >> ~/.zshrc
    echo "    - Added source line to ~/.zshrc"
else
    echo "    - Source line already exists in ~/.zshrc"
fi
echo "==> Setup complete! Restart your shell."
"""

[tasks.install]
run = """
echo "==> Installing packages via Nix flake..."
if nix profile list | grep -q "dotfiles-packages"; then
  echo "    - Nix packages already installed"
else
  nix profile install ~/.dotfiles
fi

echo "==> Installing TPM (Tmux Plugin Manager)..."
if [ -d "$HOME/.tmux/plugins/tpm" ]; then
  echo "    - TPM already installed"
else
  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
  echo "    - TPM installed"
fi

echo "==> Installing Yazi ayu-dark flavor..."
if command -v ya &> /dev/null; then
  if ya pkg list 2>/dev/null | grep -q "ayu-dark"; then
    echo "    - Yazi ayu-dark flavor already installed"
  else
    ya pkg add BennyOe/ayu-dark
    echo "    - Yazi ayu-dark flavor installed"
  fi
else
  echo "    - Warning: 'ya' command not found, skipping yazi flavor installation"
fi

echo "==> Packages installed!"
"""

[tasks.link]
run = """
echo "==> Creating symlinks with stow..."
cd ~/.dotfiles
for config in bat ghostty git lazygit mise starship tmux yazi zsh; do
    stow -R "$config"
    echo "    - Stowed $config"
done
echo "==> Symlinks created!"
"""

[tasks.update]
run = """
echo "==> Updating nix flake..."
nix flake update --flake ~/.dotfiles
nix profile upgrade '.*'
echo "==> Updating mise..."
mise self-update
echo "==> Updates complete!"
"""
