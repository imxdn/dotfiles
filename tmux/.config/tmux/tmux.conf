# Terminal Colors
set -ag terminal-overrides ",tmux-256color:RGB"
set -g default-terminal "tmux-256color"

# Use non-login shell
set -g default-shell "${SHELL}"

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Set split panes using | and - (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window
unbind '"'
unbind %

# Copy mode
bind 'v' copy-mode
set-window-option -g mode-keys vi

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded"

# Start window index at 1 instead of 0
set -g base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Set status bar to top
set -g status-position bottom

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes using prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
set -g repeat-time 1000
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session/window management
bind -n M-s choose-session
bind -n M-w choose-window
bind N new-session
bind-key -n C-Space switch-client -l

# Swap windows
bind -r "<" swap-window -t -1 -d
bind -r ">" swap-window -t +1 -d

# Swap panes
bind -r "{" swap-pane -U
bind -r "}" swap-pane -D

# Floating popup
bind g display-popup -E -w 50% -h 50%

# Performance
set -sg escape-time 0
set -g history-limit 50000
set -g display-panes-time 2000

# Enable mouse mode
set -g mouse on

#
# Plugins
#
# To install plugins:
#   1) Add plugin down here
#   2) Prefix + I to install plugin
# To update plugins:
#   1) Prefix + U
# To remove plugins:
#   1) Remove line down here
#   2) Prefix + ALT + U
#

# Default plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Custom plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'  # Auto-save every 15 minutes
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-yank'

# Theme
set -g @plugin 'TechnicalDC/tmux-ayu-theme'
set -g @ayu-theme 'dark'

# Run Tmux Plugin Manager
run '~/.tmux/plugins/tpm/tpm'
